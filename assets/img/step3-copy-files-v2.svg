<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Microsoft YaHei','Segoe UI','Courier New',monospace">
  <!-- 深色背景 / Dark background -->
  <rect width="800" height="450" fill="#0f0d12"/>

  <!-- 标题 / Title -->
  <text x="400" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#ece7db">STEP 3 · 把文件复制到 FiveM.app\data</text>
  <text x="400" y="66" text-anchor="middle" font-size="15" fill="#a79f8e">Copy Files into FiveM.app\data</text>

  <!-- 文件夹树 / Folder tree（舌尖缩短，不压文字 / short tabs, clear of text） -->
  <!-- L1 %localappdata% -->
  <path d="M 30 100 h 20 l 8 10 h 150 v 8 h -178 z" fill="#2b2537"/>
  <rect x="30" y="116" width="180" height="28" rx="4" fill="#2b2537"/>
  <text x="44" y="136" font-size="12" fill="#ff4d6d">%localappdata%\FiveM\</text>

  <!-- L2 FiveM.app -->
  <path d="M 60 160 h 20 l 8 10 h 120 v 8 h -148 z" fill="#332c42"/>
  <rect x="60" y="176" width="148" height="28" rx="4" fill="#332c42"/>
  <text x="74" y="196" font-size="12" fill="#ece7db">FiveM.app\</text>

  <!-- L3 data (高亮 / highlighted) -->
  <path d="M 90 220 h 20 l 8 10 h 88 v 8 h -116 z" fill="#ff4d6d"/>
  <rect x="90" y="236" width="116" height="28" rx="4" fill="#ff4d6d"/>
  <text x="104" y="256" font-size="12" font-weight="bold" fill="#0f0d12">data/ (放这里)</text>

  <!-- L4 caches (删除 / delete) -->
  <path d="M 90 280 h 20 l 8 10 h 88 v 8 h -116 z" fill="#3a2430"/>
  <rect x="90" y="296" width="116" height="28" rx="4" fill="#3a2430"/>
  <text x="104" y="316" font-size="12" fill="#f87171">caches/ (删除)</text>

  <!-- L5 GTA5.exe -->
  <rect x="90" y="340" width="116" height="26" rx="4" fill="#191620" stroke="#a79f8e"/>
  <text x="104" y="358" font-size="12" fill="#d8d2c4">GTA5.exe</text>

  <!-- 右侧：拖入文件 / Drag files in -->
  <rect x="330" y="150" width="210" height="90" rx="12" fill="#191620" stroke="#4ade80" stroke-width="2"/>
  <text x="435" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">画质包文件</text>
  <text x="435" y="208" text-anchor="middle" font-size="12" fill="#a79f8e">Pack files</text>
  <text x="435" y="228" text-anchor="middle" font-size="13" fill="#4ade80">复制 → 粘贴合并</text>

  <!-- 大箭头指向 data 文件夹 / Arrow pointing to the data folder -->
  <path d="M 550 205 C 610 205 620 200 660 180" stroke="#4ade80" stroke-width="4" fill="none" marker-end="url(#arBig)"/>

  <!-- 底部提示条 / Bottom note（单行文本，不重叠 / single-line text, no overlap） -->
  <rect x="20" y="388" width="760" height="58" rx="12" fill="#211d2b" stroke="#2b2537"/>
  <text x="38" y="410" font-size="14" fill="#ff4d6d" font-weight="bold">注意 Note:</text>
  <text x="38" y="434" font-size="12" fill="#d8d2c4">某些画质包（如 NVE）需要把文件放在 FiveM.app 根目录，请以画质包自带说明为准。</text>

  <defs>
    <marker id="arBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
</svg>
