<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Microsoft YaHei','Segoe UI','Courier New',monospace">
  <!-- 步骤 3：复制文件（中文版）/ Step 3: Copy Files (Chinese) -->
  <rect width="800" height="450" fill="#0f0d12"/>

  <!-- 标题 / Title -->
  <text x="400" y="38" text-anchor="middle" font-size="26" font-weight="bold" fill="#ece7db">STEP 3 · 把文件复制到 FiveM</text>
  <text x="400" y="64" text-anchor="middle" font-size="15" fill="#a79f8e">Copy Pack Files into FiveM（最关键的一步）</text>

  <!-- 文件夹树 / Folder tree -->
  <!-- L1 %localappdata% -->
  <path d="M 30 96 h 20 l 8 10 h 150 v 8 h -178 z" fill="#2b2537"/>
  <rect x="30" y="112" width="180" height="26" rx="4" fill="#2b2537"/>
  <text x="44" y="131" font-size="12" fill="#ff4d6d">%localappdata%\FiveM\</text>

  <!-- L2 FiveM.app -->
  <path d="M 60 152 h 20 l 8 10 h 120 v 8 h -148 z" fill="#332c42"/>
  <rect x="60" y="168" width="148" height="26" rx="4" fill="#332c42"/>
  <text x="74" y="187" font-size="12" fill="#ece7db">FiveM.app\</text>

  <!-- L3 data (高亮 / highlighted) -->
  <path d="M 90 208 h 20 l 8 10 h 88 v 8 h -116 z" fill="#ff4d6d"/>
  <rect x="90" y="224" width="116" height="26" rx="4" fill="#ff4d6d"/>
  <text x="104" y="243" font-size="12" font-weight="bold" fill="#0f0d12">data\ 放这里</text>

  <!-- L4 Mods/Plugins（一起拷 / copy as-is） -->
  <path d="M 90 264 h 20 l 8 10 h 118 v 8 h -146 z" fill="#1f3a2b"/>
  <rect x="90" y="280" width="146" height="26" rx="4" fill="#1f3a2b" stroke="#4ade80"/>
  <text x="104" y="299" font-size="12" fill="#4ade80">Mods/Plugins 一起拷</text>

  <!-- L5 caches (删除 / delete) -->
  <path d="M 90 320 h 20 l 8 10 h 88 v 8 h -116 z" fill="#3a2430"/>
  <rect x="90" y="336" width="116" height="26" rx="4" fill="#3a2430"/>
  <text x="104" y="355" font-size="12" fill="#f87171">caches\ 删除（可选）</text>

  <!-- 右侧：画质包文件 / Pack files -->
  <rect x="330" y="150" width="210" height="96" rx="12" fill="#191620" stroke="#4ade80" stroke-width="2"/>
  <text x="435" y="182" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">画质包文件</text>
  <text x="435" y="202" text-anchor="middle" font-size="12" fill="#a79f8e">Pack files (extracted)</text>
  <text x="435" y="228" text-anchor="middle" font-size="13" fill="#4ade80">Ctrl+A 全选 → Ctrl+C</text>

  <!-- 大箭头指向 data / Arrow to the data folder -->
  <path d="M 320 215 C 280 215 250 205 216 178" stroke="#4ade80" stroke-width="4" fill="none" marker-end="url(#arBig)"/>

  <!-- 右侧下方：粘贴提示 / Paste hint -->
  <rect x="330" y="262" width="210" height="58" rx="12" fill="#211d2b" stroke="#2b2537"/>
  <text x="435" y="284" text-anchor="middle" font-size="13" fill="#d8d2c4">粘贴到 data\：Ctrl+V</text>
  <text x="435" y="306" text-anchor="middle" font-size="12" fill="#4ade80">提示合并/替换 → 选“是”</text>

  <!-- 底部提示条 / Bottom note -->
  <rect x="20" y="388" width="760" height="58" rx="12" fill="#211d2b" stroke="#2b2537"/>
  <text x="38" y="410" font-size="14" fill="#ff4d6d" font-weight="bold">注意 Note:</text>
  <text x="38" y="434" font-size="12" fill="#d8d2c4">默认路径 %localappdata%\FiveM\FiveM.app；自定义安装如 D:\FiveM_Legacy\FiveM.app。少数画质包（如 NVE）要放 FiveM.app 根目录，以说明为准。</text>

  <defs>
    <marker id="arBig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4ade80"/>
    </marker>
  </defs>
</svg>
