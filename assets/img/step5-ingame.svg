<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <!-- 深色背景 / Dark background -->
  <rect width="800" height="450" fill="#141821"/>

  <!-- 标题 / Title -->
  <text x="400" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#f5f7fa">STEP 5 · 游戏内启用画质</text>
  <text x="400" y="70" text-anchor="middle" font-size="15" fill="#8d98ad">Enable the Pack In-Game</text>

  <!-- 屏幕 mockup / Screen -->
  <rect x="60" y="100" width="420" height="260" rx="14" fill="#0e1119" stroke="#3a4256" stroke-width="3"/>
  <rect x="60" y="100" width="420" height="24" rx="14" fill="#1a1f2d"/>
  <rect x="60" y="112" width="420" height="12" fill="#1a1f2d"/>
  <!-- 屏幕内画面示意 -->
  <rect x="80" y="140" width="380" height="200" rx="8" fill="#16212e"/>
  <circle cx="430" cy="300" r="70" fill="#f39c12" opacity="0.18"/>
  <circle cx="120" cy="180" r="45" fill="#3498db" opacity="0.25"/>
  <circle cx="330" cy="240" r="30" fill="#2ecc71" opacity="0.25"/>
  <path d="M 80 320 L 200 250 L 330 320 L 460 220" stroke="#f39c12" stroke-width="2" opacity="0.5" fill="none"/>
  <text x="270" y="330" text-anchor="middle" font-size="16" fill="#c7d0e0">GTA V 游戏画面</text>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#8d98ad">In-game view</text>
  <!-- Home 键提示 -->
  <rect x="180" y="156" width="130" height="40" rx="8" fill="#f39c12"/>
  <text x="245" y="182" text-anchor="middle" font-size="16" font-weight="bold" fill="#141821">按 Home 键</text>

  <!-- 右侧流程 / Flow -->
  <!-- Step A -->
  <rect x="540" y="110" width="230" height="70" rx="12" fill="#1f2433" stroke="#3498db" stroke-width="2"/>
  <circle cx="566" cy="145" r="14" fill="#3498db"/>
  <text x="566" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#141821">A</text>
  <text x="588" y="140" font-size="13" font-weight="bold" fill="#f5f7fa">启动 FiveM 进入服务器</text>
  <text x="588" y="160" font-size="11" fill="#8d98ad">Launch FiveM, join a server</text>

  <path d="M 655 180 L 655 200" stroke="#f39c12" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Step B -->
  <rect x="540" y="200" width="230" height="70" rx="12" fill="#1f2433" stroke="#f39c12" stroke-width="2"/>
  <circle cx="566" cy="235" r="14" fill="#f39c12"/>
  <text x="566" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#141821">B</text>
  <text x="588" y="230" font-size="13" font-weight="bold" fill="#f5f7fa">按 Home 打开 ReShade 面板</text>
  <text x="588" y="250" font-size="11" fill="#8d98ad">Press Home, open ReShade panel</text>

  <path d="M 655 270 L 655 290" stroke="#f39c12" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Step C -->
  <rect x="540" y="290" width="230" height="70" rx="12" fill="#1f2433" stroke="#2ecc71" stroke-width="2"/>
  <circle cx="566" cy="325" r="14" fill="#2ecc71"/>
  <text x="566" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#141821">C</text>
  <text x="588" y="320" font-size="13" font-weight="bold" fill="#f5f7fa">选择画质包预设，尽情游玩</text>
  <text x="588" y="340" font-size="11" fill="#8d98ad">Select preset and enjoy!</text>

  <!-- 底部提示条 / Bottom note -->
  <rect x="20" y="380" width="760" height="52" rx="12" fill="#1c2130" stroke="#3a4256"/>
  <text x="38" y="405" font-size="13" fill="#c7d0e0">可在游戏设置中开启“高级图形设置 → 超高”，配合画质包效果更佳。</text>
  <text x="38" y="423" font-size="12" fill="#8d98ad">Enable "Advanced Graphics → Very High" in game settings for the best result.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f39c12"/>
    </marker>
  </defs>
</svg>
