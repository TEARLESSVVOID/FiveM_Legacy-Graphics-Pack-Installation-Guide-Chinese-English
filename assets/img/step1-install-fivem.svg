<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Microsoft YaHei','Segoe UI',Arial,sans-serif">
  <!-- 深色背景 / Dark background -->
  <rect width="800" height="450" fill="#0f0d12"/>

  <!-- 标题 / Title -->
  <text x="400" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#ece7db">STEP 1 · 安装 FiveM</text>
  <text x="400" y="70" text-anchor="middle" font-size="15" fill="#a79f8e">Install FiveM Client</text>

  <!-- 四个步骤卡片 / Four step cards -->
  <!-- Card 1 -->
  <rect x="12" y="120" width="150" height="150" rx="12" fill="#191620" stroke="#ff4d6d" stroke-width="2"/>
  <circle cx="87" cy="152" r="16" fill="#ff4d6d"/>
  <text x="87" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f0d12">1</text>
  <text x="87" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">打开 fivem.net</text>
  <text x="87" y="222" text-anchor="middle" font-size="12" fill="#a79f8e">Open fivem.net</text>
  <text x="87" y="248" text-anchor="middle" font-size="12" fill="#ff4d6d">点击 Download</text>

  <!-- Arrow 1 -->
  <path d="M 168 195 L 214 195" stroke="#ff4d6d" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Card 2 -->
  <rect x="220" y="120" width="150" height="150" rx="12" fill="#191620" stroke="#ff4d6d" stroke-width="2"/>
  <circle cx="295" cy="152" r="16" fill="#ff4d6d"/>
  <text x="295" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f0d12">2</text>
  <text x="295" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">运行安装器</text>
  <text x="295" y="222" text-anchor="middle" font-size="12" fill="#a79f8e">Run Installer</text>
  <text x="295" y="248" text-anchor="middle" font-size="12" fill="#ff4d6d">自动检测路径</text>

  <!-- Arrow 2 -->
  <path d="M 376 195 L 422 195" stroke="#ff4d6d" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Card 3 -->
  <rect x="428" y="120" width="150" height="150" rx="12" fill="#191620" stroke="#ff4d6d" stroke-width="2"/>
  <circle cx="503" cy="152" r="16" fill="#ff4d6d"/>
  <text x="503" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f0d12">3</text>
  <text x="503" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">选择 GTA V</text>
  <text x="503" y="222" text-anchor="middle" font-size="12" fill="#a79f8e">Select GTA V</text>
  <text x="503" y="248" text-anchor="middle" font-size="12" fill="#ff4d6d">手动指定路径</text>

  <!-- Arrow 3 -->
  <path d="M 584 195 L 630 195" stroke="#ff4d6d" stroke-width="3" marker-end="url(#ar)"/>

  <!-- Card 4 -->
  <rect x="636" y="120" width="150" height="150" rx="12" fill="#191620" stroke="#4ade80" stroke-width="2"/>
  <circle cx="711" cy="152" r="16" fill="#4ade80"/>
  <text x="711" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f0d12">4</text>
  <text x="711" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#ece7db">完成安装</text>
  <text x="711" y="222" text-anchor="middle" font-size="12" fill="#a79f8e">Install Done</text>
  <text x="711" y="248" text-anchor="middle" font-size="12" fill="#4ade80">✓ 进入服务器</text>

  <!-- 底部提示条 / Bottom note -->
  <rect x="12" y="330" width="776" height="90" rx="12" fill="#211d2b" stroke="#2b2537"/>
  <text x="30" y="365" font-size="14" fill="#ff4d6d" font-weight="bold">注意 Note:</text>
  <text x="30" y="390" font-size="13" fill="#d8d2c4">需要正版 GTA V（Steam / Epic / Rockstar 均可），并预留至少 30GB 磁盘空间。</text>
  <text x="30" y="410" font-size="12" fill="#a79f8e">Requires a genuine copy of GTA V (Steam / Epic / Rockstar) and at least 30GB of free disk space.</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4d6d"/>
    </marker>
  </defs>
</svg>
