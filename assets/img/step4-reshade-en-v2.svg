<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="'Segoe UI','Microsoft YaHei',Arial,sans-serif">
  <!-- Step 4: Install ReShade (English) / 步骤 4 英文版 -->
  <rect width="800" height="450" fill="#0f0d12"/>

  <text x="400" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#ece7db">STEP 4 · Install ReShade (optional)</text>
  <text x="400" y="70" text-anchor="middle" font-size="15" fill="#a79f8e">Needed by some graphics packs</text>

  <!-- ReShade setup window -->
  <rect x="30" y="100" width="480" height="290" rx="12" fill="#191620" stroke="#2b2537" stroke-width="2"/>
  <rect x="30" y="100" width="480" height="36" rx="12" fill="#2b2537"/>
  <rect x="30" y="122" width="480" height="14" fill="#2b2537"/>
  <circle cx="52" cy="118" r="6" fill="#f87171"/>
  <circle cx="74" cy="118" r="6" fill="#f1c40f"/>
  <circle cx="96" cy="118" r="6" fill="#4ade80"/>
  <text x="270" y="124" text-anchor="middle" font-size="14" fill="#d8d2c4">ReShade Setup</text>

  <!-- Row 1: Select game -->
  <rect x="52" y="152" width="436" height="52" rx="8" fill="#211d2b" stroke="#2b2537"/>
  <text x="70" y="174" font-size="13" fill="#ece7db">Select game:</text>
  <text x="230" y="174" font-size="12" fill="#ff4d6d">…\FiveM\FiveM.exe</text>
  <text x="230" y="194" font-size="11" fill="#a79f8e">or the Legacy GTA5.exe — same result</text>

  <!-- Row 2: API -->
  <rect x="52" y="212" width="436" height="44" rx="8" fill="#211d2b" stroke="#2b2537"/>
  <text x="70" y="241" font-size="13" fill="#ece7db">API:</text>
  <text x="230" y="241" font-size="12" fill="#4ade80">DirectX 10/11/12 ✓</text>

  <!-- Row 3: Shaders -->
  <rect x="52" y="264" width="436" height="44" rx="8" fill="#211d2b" stroke="#2b2537"/>
  <text x="70" y="293" font-size="13" fill="#ece7db">Shaders:</text>
  <text x="230" y="293" font-size="12" fill="#4ade80">Standard effects ✓</text>

  <!-- Row 4: Preset -->
  <rect x="52" y="316" width="436" height="52" rx="8" fill="#211d2b" stroke="#ff4d6d"/>
  <text x="70" y="338" font-size="13" fill="#ece7db">Preset:</text>
  <text x="230" y="338" font-size="12" fill="#ff4d6d">pack.ini → FiveM.app\plugins</text>
  <text x="230" y="358" font-size="11" fill="#a79f8e">or set PresetPath= in ReShade.ini</text>

  <!-- Steps -->
  <rect x="540" y="100" width="230" height="290" rx="12" fill="#211d2b" stroke="#2b2537"/>
  <text x="655" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#ece7db">Quick Steps</text>
  <text x="560" y="174" font-size="13" fill="#d8d2c4">1. Download from reshade.me</text>
  <text x="560" y="202" font-size="13" fill="#d8d2c4">2. Pick FiveM.exe or Legacy GTA5.exe</text>
  <text x="560" y="230" font-size="13" fill="#d8d2c4">3. API: DirectX 10/11/12</text>
  <text x="560" y="258" font-size="13" fill="#d8d2c4">4. Tick shaders to download</text>
  <text x="560" y="286" font-size="13" fill="#d8d2c4">5. Cut dxgi.dll + 4 more items</text>
  <text x="560" y="310" font-size="13" fill="#4ade80">6. → FiveM.app\plugins</text>
  <text x="560" y="342" font-size="12" fill="#a79f8e">Put the preset .ini in plugins too</text>
  <text x="560" y="366" font-size="12" fill="#a79f8e">FiveM only loads ReShade from plugins</text>
</svg>
