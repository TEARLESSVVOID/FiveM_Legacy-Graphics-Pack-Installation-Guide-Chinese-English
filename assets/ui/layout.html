<header>
  <h1 id="siteTitle"></h1>
  <div>
    <button class="lang-btn active" id="btnZh" type="button" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" id="btnEn" type="button" onclick="setLang('en')">English</button>
  </div>
</header>

<div id="notice">
  <strong data-zh="提示：" data-en="Notice: "></strong>
  <span data-zh="无法加载教程内容。请检查网络，或确认仓库里的 assets/content.json 存在。"
        data-en="Could not load the tutorial. Check your network, or make sure assets/content.json exists in the repo."></span>
</div>

<nav id="toc"></nav>

<main id="content"><!-- 正文由 JS 渲染 / Rendered by JS --></main>

<footer id="siteFooter"></footer>

<button id="backTop" type="button" aria-label="回到顶部 / Back to top">↑</button>
