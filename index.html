<!DOCTYPE html>
<!--
  FiveM 画质包安装教程 / FiveM Graphics Pack Installation Tutorial
  本地优先 / Local-first entry page:
    · 布局内嵌在本文件；样式/引擎/内容从本地 assets/ 加载 —— 双击即可
      完整预览，无需网络（离线可用）
      Layout is embedded here; css/engine/content load from local
      assets/ — double-click and the page fully renders, no network
      needed (offline works).
    · 在线时自动从 GitHub 拉取最新版覆盖（raw 慢/失败自动切 CDN），
      刷新页面即可获得最新内容；离线则始终显示本地版本
      When online, the latest version is fetched from GitHub (CDN
      fallback) and overrides the local copy on refresh; offline just
      keeps the local copy.
  文件分工 / File roles (edit the local file, then refresh to preview;
  我会定期同步到 GitHub / I will sync them to GitHub on request):
    1. index.html            —— 布局 + 引导（改 UI 布局才动这里）
                                layout + bootstrap (edit only for UI changes)
    2. assets/css/style.css  —— 全部样式 / all styles
    3. assets/js/main.js     —— 渲染引擎 / rendering engine
    4. assets/content.js     —— 教程正文（window.TUTORIAL_CONTENT）
                                tutorial content
    5. assets/img, assets/video —— 图片与视频 / images and video
-->
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FiveM Graphics Pack Installation Tutorial</title>

  <!-- 本地样式（离线可预览）/ local css (offline preview) -->
  <link rel="stylesheet" href="assets/css/style.css"/>

  <script>
    /* ======================================================================
     * 引导配置 / Bootstrap config
     * 在线更新用的远程地址（raw 优先，CDN 备用）；离线时全部本地加载。
     * Remote URLs for online refresh (raw first, CDN fallback); offline
     * is fully local.
     * ====================================================================== */
    var CONFIG = {
      owner:  "TEARLESSVVOID",
      repo:   "FiveM_Legacy-Graphics-Pack-Installation-Guide-Chinese-English",
      branch: "main",
      css:    "assets/css/style.css",
      content: "assets/content.js"
    };
    CONFIG.OK = CONFIG.owner !== "YOUR_GITHUB_USERNAME" && CONFIG.repo !== "YOUR_REPO_NAME";

    var LOAD_TIMEOUT = 3000; // 毫秒 / ms

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + path;
    }
    function cdnUrl(path) {
      return "https://cdn.jsdelivr.net/gh/" + CONFIG.owner + "/" + CONFIG.repo + "@" + CONFIG.branch + "/" + path;
    }

    /* 拉取文本：GitHub 优先；超时、失败或响应不可读（如 CORS/file: 拦截）
       时改用 CDN。任一路径成功即 resolve 一次；CDN 只尝试一次。
       Fetch text: GitHub first; on timeout, failure, or unreadable
       response fall back to the CDN. Resolves once; CDN tried once. */
    function fetchAny(path, asJson) {
      var gUrl = rawUrl(path) + "?t=" + Date.now();
      var cUrl = cdnUrl(path);
      function ok(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return asJson ? r.json() : r.text();
      }
      return new Promise(function (resolve, reject) {
        var settled = false, timedOut = false, cdnTried = false;
        function win(v) { if (!settled) { settled = true; resolve(v); } }
        function lose(e) { if (!settled) { settled = true; reject(e); } }
        function tryCdn() {
          if (!settled && !cdnTried) {
            cdnTried = true;
            fetch(cUrl).then(ok).then(win, lose);
          }
        }
        fetch(gUrl).then(function (r) {
          if (!timedOut) ok(r).then(win, function () { tryCdn(); });
        }, tryCdn);
        setTimeout(function () {
          timedOut = true; // GitHub 太慢，忽略其迟到结果 / too slow, ignore late result
          tryCdn();
        }, LOAD_TIMEOUT);
      });
    }

    window.CONFIG = CONFIG;
    window.LOAD_TIMEOUT = LOAD_TIMEOUT;
    window.RAW_URL = rawUrl;
    window.CDN_URL = cdnUrl;
    window.FETCH_ANY = fetchAny;

    /* 在线刷新：拉最新样式覆盖本地 <link>（失败静默，本地样式照用）。
       Online refresh: fetch the newest css and override the local
       <link> (silently keep the local css on failure). */
    document.addEventListener("DOMContentLoaded", function () {
      if (!CONFIG.OK) return;
      FETCH_ANY(CONFIG.css, false)
        .then(function (css) {
          var st = document.createElement("style");
          st.id = "remoteCss";
          st.textContent = css;
          document.head.appendChild(st);
        })
        .catch(function () { /* 离线：本地样式 / offline: local css */ });
    });
  </script>
</head>
<body>

  <!-- 页面骨架（内嵌，离线可用）/ page skeleton (embedded, offline) -->
  <header>
    <h1 id="siteTitle"></h1>
    <div>
      <button class="lang-btn active" id="btnZh" type="button" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" id="btnEn" type="button" onclick="setLang('en')">English</button>
    </div>
  </header>

  <div id="notice">
    <strong data-zh="提示：" data-en="Notice: "></strong>
    <span data-zh="无法加载教程内容。请确认 assets/content.js 存在于本文件夹（或检查网络后刷新，联网时会自动获取最新内容）。"
          data-en="Could not load the tutorial. Make sure assets/content.js exists in this folder (or refresh while online — the latest content is fetched automatically)."></span>
  </div>

  <nav id="toc"></nav>

  <main id="content"><!-- 正文由 JS 渲染 / Rendered by JS --></main>

  <footer id="siteFooter"></footer>

  <button id="backTop" type="button" aria-label="回到顶部 / Back to top">↑</button>

  <!-- 本地内容（JSONP）与本地引擎（离线可预览）/
       local content (JSONP) and local engine (offline preview) -->
  <script src="assets/content.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
