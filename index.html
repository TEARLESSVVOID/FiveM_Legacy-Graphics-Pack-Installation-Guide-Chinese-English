<!DOCTYPE html>
<!--
  FiveM Mods 安装教程 / FiveM Mods Installation Tutorial
  极简入口 / Minimal entry page:
    · 本页只负责"拉取并组装"，本身不含任何 UI 布局
      This page only fetches and assembles — it contains no UI layout itself
    · 所有内容都从 GitHub 拉取，并套 jsdelivr CDN 备用：
      GitHub 响应超过 LOAD_TIMEOUT 毫秒或失败时，自动改用 CDN 加速
      Everything is fetched from GitHub with a jsdelivr CDN fallback:
      if GitHub is slower than LOAD_TIMEOUT ms or fails, the CDN is used.
  文件分工 / File roles (edit these in the repo, then refresh):
    1. assets/ui/layout.html   —— 页面骨架：顶栏/目录/正文容器/页脚（改 UI 布局、加板块就改这里）
       page skeleton: header/nav/main/footer — edit here for UI changes
    2. assets/css/style.css    —— 全部样式 / all styles
    3. assets/js/main.js       —— 渲染引擎 / rendering engine
    4. assets/content.json     —— 教程正文 / tutorial content
-->
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FiveM Mods Installation Tutorial</title>
  <script>
    /* ======================================================================
     * 引导器 / Bootstrap
     * 拉取顺序：layout（骨架）→ css（样式）→ main.js（渲染引擎，内部再
     * 拉 content.json）。每步都走 GitHub 优先 + CDN 备用。
     * Order: layout → css → main.js (which fetches content.json).
     * Every step uses GitHub first with a CDN fallback.
     *
     * 兼容 file:// 本地打开：脚本用 <script> 标签加载（跨域执行不受
     * CORS/file: 限制）；layout/css 拉取失败时退回 JS 兜底骨架与样式，
     * 保证页面不空白、错误提示可见。
     * Works when opened via file:// too: the engine is loaded with a
     * <script> tag (cross-origin script execution is not blocked by
     * CORS). If layout/css fetch fails, a JS fallback skeleton is used
     * so the page never stays blank.
     * ====================================================================== */
    var CONFIG = {
      owner:  "TEARLESSVVOID",
      repo:   "FiveM_Legacy-Graphics-Pack-Installation-Guide-Chinese-English",
      branch: "main",
      layout:  "assets/ui/layout.html",
      css:    "assets/css/style.css",
      js:     "assets/js/main.js",
      content: "assets/content.json"
    };
    CONFIG.OK = CONFIG.owner !== "YOUR_GITHUB_USERNAME" && CONFIG.repo !== "YOUR_REPO_NAME";

    /* 超时阈值（毫秒）：GitHub 直连超过此时长就切换 CDN 加速。
       Timeout (ms) for GitHub direct fetch before switching to CDN. */
    var LOAD_TIMEOUT = 3000;

    // GitHub 直连地址 / Direct GitHub URL
    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + path;
    }
    // jsdelivr CDN 备用地址 / jsdelivr CDN fallback URL
    function cdnUrl(path) {
      return "https://cdn.jsdelivr.net/gh/" + CONFIG.owner + "/" + CONFIG.repo + "@" + CONFIG.branch + "/" + path;
    }

    /* 拉取文本/JSON：先请求 GitHub；超时、失败或响应不可读时改用 CDN。
       任一路径只要成功即 resolve 一次；CDN 只尝试一次。
       Fetch text/JSON: GitHub first; fall back to CDN on timeout, network
       failure, or unreadable response (e.g. CORS block). Resolves once;
       the CDN is only tried a single time. */
    function fetchAny(path, asJson) {
      var gUrl = rawUrl(path) + "?t=" + Date.now();
      var cUrl = cdnUrl(path);
      function ok(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return asJson ? r.json() : r.text();
      }
      return new Promise(function (resolve, reject) {
        var settled = false, timedOut = false, cdnTried = false;
        function win(v) { if (!settled) { settled = true; resolve(v); } }
        function lose(e) { if (!settled) { settled = true; reject(e); } }
        function tryCdn() {
          if (!settled && !cdnTried) {
            cdnTried = true;
            fetch(cUrl).then(ok).then(win, lose);
          }
        }
        fetch(gUrl).then(function (r) {
          if (!timedOut) ok(r).then(win, function () { tryCdn(); });
        }, function () {
          // GitHub 请求立即失败 → 直接用 CDN / GitHub failed at once → CDN
          tryCdn();
        });
        setTimeout(function () {
          timedOut = true; // GitHub 太慢，忽略其迟到结果 / too slow, ignore late result
          tryCdn();
        }, LOAD_TIMEOUT);
      });
    }

    window.CONFIG = CONFIG;
    window.LOAD_TIMEOUT = LOAD_TIMEOUT;
    window.RAW_URL = rawUrl;
    window.CDN_URL = cdnUrl;
    window.FETCH_ANY = fetchAny;

    /* 动态加载主脚本：<script> 标签加载（GitHub 优先，onerror/超时切 CDN）。
       跨域 script 不受 CORS/file: 限制，本地打开也可靠。
       引擎内部有单实例守卫（__FIVEM_ENGINE__），GitHub 与 CDN 两个脚本
       同时被加载时只有第一个会执行渲染，不会互相覆盖。
       Load engine via <script> tag (GitHub first, CDN on error/timeout).
       Cross-origin scripts ignore CORS/file: limits, so local file://
       opening works too. The engine has a singleton guard so if both
       scripts load, only the first one renders. */
    function loadMain() {
      var cdnTried = false;
      function tryCdn() {
        if (cdnTried || window.__FIVEM_ENGINE__) return; // 引擎已在跑就不必再加载 / skip if engine already ran
        cdnTried = true;
        var c = document.createElement("script");
        c.src = cdnUrl(CONFIG.js);
        document.head.appendChild(c);
      }
      var s = document.createElement("script");
      s.src = rawUrl(CONFIG.js) + "?t=" + Date.now();
      s.onerror = tryCdn;
      document.head.appendChild(s);
      setTimeout(tryCdn, LOAD_TIMEOUT);
    }

    /* layout/css 拉取失败时的兜底骨架与最小样式：页面不空白，
       标题、错误提示、目录容器都在，用户能看到诊断信息。
       Fallback skeleton + minimal CSS when layout/css fetch fails:
       the page stays visible with title, notice and containers. */
    function fallbackSkeleton() {
      var body = document.body;
      body.innerHTML = "";
      var h = document.createElement("header");
      var h1 = document.createElement("h1");
      h1.id = "siteTitle";
      h1.textContent = "FiveM Mods Installation Tutorial";
      h.appendChild(h1);
      var n = document.createElement("div");
      n.id = "notice";
      n.innerHTML =
        '<strong data-zh="提示：" data-en="Notice: "></strong>' +
        '<span data-zh="无法加载教程内容。请检查网络是否可访问 GitHub 与 jsdelivr CDN（若使用本地 file:// 打开，部分浏览器会拦截跨源读取），然后刷新页面重试。建议用 Edge 或 Chrome 打开。" ' +
        'data-en="Could not load the tutorial. Check that GitHub and the jsdelivr CDN are reachable (browsers may block cross-origin reads on local file:// pages), then refresh. Use Edge or Chrome."></span>';
      var nav = document.createElement("nav"); nav.id = "toc";
      var m = document.createElement("main"); m.id = "content";
      var f = document.createElement("footer"); f.id = "siteFooter";
      var b = document.createElement("button"); b.id = "backTop"; b.type = "button";
      b.setAttribute("aria-label", "回到顶部 / Back to top");
      b.textContent = "↑";
      [h, n, nav, m, f, b].forEach(function (el) { body.appendChild(el); });
      var st = document.createElement("style");
      st.textContent =
        "body{font-family:Segoe UI,'Microsoft YaHei',Arial,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#14161b;color:#e8eaf0}" +
        "#notice{display:none;background:#2b1d1c;color:#f2c9c2;padding:12px 14px;border-radius:8px;margin:12px 0}" +
        "#backTop{position:fixed;right:20px;bottom:20px;border-radius:8px;border:1px solid #3a3f4a;background:#1e222b;color:#e8eaf0;padding:8px 12px;display:none}" +
        "#toc a{display:inline-block;margin-right:10px;color:#7ec8ff;text-decoration:none}";
      document.head.appendChild(st);
    }

    /* 页面就绪：注入 layout → 注入 css → 加载 main.js。
       任一步失败都回退兜底骨架，页面始终有可见内容。
       On ready: inject layout → inject css → load main.js.
       Any failure falls back to the skeleton, the page always shows. */
    document.addEventListener("DOMContentLoaded", function () {
      if (!CONFIG.OK) {
        document.body.innerHTML =
          '<div style="background:#2b1d1c;color:#f2c9c2;padding:20px;font-family:sans-serif">' +
          '请在 index.html 的 CONFIG 里填写你自己的 GitHub 用户名与仓库名。<br>' +
          'Fill in your GitHub username and repo name in CONFIG inside index.html.</div>';
        return;
      }
      fetchAny(CONFIG.layout, false)
        .then(function (html) {
          document.body.innerHTML = html;
          return fetchAny(CONFIG.css, false).then(function (css) {
            var st = document.createElement("style");
            st.textContent = css;
            document.head.appendChild(st);
          }).catch(function (e) { console.error("css failed:", e); });
        })
        .then(function () {
          loadMain();
        })
        .catch(function (e) {
          console.error("layout failed:", e);
          fallbackSkeleton();
          loadMain(); // 引擎可独立拉起正文；失败时引擎自会显示错误提示 / engine may still load content
        });
    });
  </script>
</head>
<body>
</body>
</html>
