<!DOCTYPE html>
<!--
  FiveM 画质包安装教程 / FiveM Graphics Pack Installation Tutorial
  数据驱动 / Data-driven:
    · 本页只是加载器，正文在仓库 assets/content.json
      This page is a loader; the tutorial text lives in assets/content.json
    · CSS / JS / 内容 / 图片 全部从 GitHub 拉取，并套上 jsdelivr CDN 备用：
      GitHub 响应超过 LOAD_TIMEOUT 毫秒或失败时，自动改用 CDN 加速
      All assets (css/js/content/images) are fetched from GitHub with a
      jsdelivr CDN fallback: if GitHub takes longer than LOAD_TIMEOUT ms
      or fails, the CDN is used automatically.
  用法 / Usage:
    1. 上传 index.html + assets/ 到 GitHub 仓库
    2. 在下方 CONFIG 填你的用户名与仓库名
    3. 编辑 assets/content.json 即可更新教程
-->
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FiveM 画质包安装教程 · FiveM Graphics Pack Tutorial</title>
  <script>
    /* ======================================================================
     * 配置与加载器 / Config & loader
     * 所有资源 GitHub 优先；慢于 LOAD_TIMEOUT 或失败则切 jsdelivr CDN。
     * GitHub first; switch to the jsdelivr CDN when slower than
     * LOAD_TIMEOUT or on failure.
     * ====================================================================== */
    var CONFIG = {
      owner:  "TEARLESSVVOID",
      repo:   "FiveM_Legacy-Graphics-Pack-Installation-Guide-Chinese-English",
      branch: "main",
      css:    "assets/css/style.css",
      js:     "assets/js/main.js",
      content: "assets/content.json"
    };
    CONFIG.OK = CONFIG.owner !== "YOUR_GITHUB_USERNAME" && CONFIG.repo !== "YOUR_REPO_NAME";

    /* 超时阈值（毫秒）：GitHub 直连超过此时长就切换 CDN 加速。
       注意：阈值设成 2ms 不现实（任何网络请求都远超），
       那样等于永远走 CDN，GitHub 直连形同虚设。
       Timeout (ms) for GitHub direct fetch before switching to CDN. */
    var LOAD_TIMEOUT = 3000;

    // GitHub 直连地址 / Direct GitHub URL
    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + path;
    }
    // jsdelivr CDN 备用地址 / jsdelivr CDN fallback URL
    function cdnUrl(path) {
      return "https://cdn.jsdelivr.net/gh/" + CONFIG.owner + "/" + CONFIG.repo + "@" + CONFIG.branch + "/" + path;
    }

    /* 拉取文本/JSON：先请求 GitHub；超时或失败后改用 CDN。
       Fetch text/JSON: try GitHub first; fall back to the CDN on timeout/failure. */
    function fetchAny(path, asJson) {
      var gUrl = rawUrl(path) + "?t=" + Date.now();
      var cUrl = cdnUrl(path);
      function ok(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return asJson ? r.json() : r.text();
      }
      return new Promise(function (resolve, reject) {
        var settled = false, timedOut = false;
        function win(v) { if (!settled) { settled = true; resolve(v); } }
        function lose(e) { if (!settled) { settled = true; reject(e); } }
        fetch(gUrl).then(function (r) {
          if (!timedOut) ok(r).then(win, lose);
        }, function () {
          // GitHub 请求立即失败 → 直接用 CDN / GitHub failed at once → CDN
          if (!settled) fetch(cUrl).then(ok).then(win, lose);
        });
        setTimeout(function () {
          timedOut = true; // GitHub 太慢，忽略其迟到结果 / too slow, ignore late result
          fetch(cUrl).then(ok).then(win, lose);
        }, LOAD_TIMEOUT);
      });
    }

    window.CONFIG = CONFIG;
    window.LOAD_TIMEOUT = LOAD_TIMEOUT;
    window.RAW_URL = rawUrl;
    window.CDN_URL = cdnUrl;
    window.FETCH_ANY = fetchAny;

    /* 动态加载主脚本（GitHub 优先，onerror/超时切 CDN）。
       注意：script 元素插入文档后修改 src 不会重新加载，所以切换时要
       新建元素再插入 / Once appended, changing a script's src does not
       reload it — create a fresh element when switching to the CDN. */
    function loadMain() {
      var loaded = false, switched = false;
      function addScript(url) {
        var s = document.createElement("script");
        s.src = url + "?t=" + Date.now();
        s.onload = function () { loaded = true; };
        s.onerror = function () {
          if (!switched) { switched = true; addScript(cdnUrl(CONFIG.js)); }
        };
        document.head.appendChild(s);
        return s;
      }
      addScript(rawUrl(CONFIG.js));
      setTimeout(function () {
        if (!loaded && !switched) { switched = true; addScript(cdnUrl(CONFIG.js)); }
      }, LOAD_TIMEOUT);
    }

    /* 页面就绪：先隐藏 body 防止无样式闪烁，拉取 CSS 后再显示
       Hide body to avoid unstyled flash, show it after CSS arrives. */
    document.addEventListener("DOMContentLoaded", function () {
      document.body.style.visibility = "hidden";
      fetchAny(CONFIG.css, false)
        .then(function (css) {
          var st = document.createElement("style");
          st.textContent = css;
          document.head.appendChild(st);
        })
        .catch(function (e) { console.error("css failed:", e); })
        .then(function () { document.body.style.visibility = ""; });
      loadMain();
    });
  </script>
</head>
<body>

  <header>
    <h1 id="siteTitle"></h1>
    <div>
      <button class="lang-btn active" id="btnZh" type="button" onclick="setLang('zh')">中文</button>
      <button class="lang-btn" id="btnEn" type="button" onclick="setLang('en')">English</button>
    </div>
  </header>

  <div id="notice">
    <strong data-zh="提示：" data-en="Notice: "></strong>
    <span data-zh="无法加载教程内容。请检查网络，或确认仓库里的 assets/content.json 存在。"
          data-en="Could not load the tutorial. Check your network, or make sure assets/content.json exists in the repo."></span>
  </div>

  <nav id="toc"></nav>

  <main id="content"><!-- 正文由 JS 渲染 / Rendered by JS --></main>

  <footer id="siteFooter"></footer>

  <button id="backTop" type="button" aria-label="回到顶部 / Back to top">↑</button>

</body>
</html>
