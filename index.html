<!DOCTYPE html>
<!--
  FiveM Mods 安装教程 / FiveM Mods Installation Tutorial
  极简入口 / Minimal entry page:
    · 本页只负责"拉取并组装"，本身不含任何 UI 布局
      This page only fetches and assembles — it contains no UI layout itself
    · 所有内容都从 GitHub 拉取，并套 jsdelivr CDN 备用：
      GitHub 响应超过 LOAD_TIMEOUT 毫秒或失败时，自动改用 CDN 加速
      Everything is fetched from GitHub with a jsdelivr CDN fallback:
      if GitHub is slower than LOAD_TIMEOUT ms or fails, the CDN is used.
  文件分工 / File roles (edit these in the repo, then refresh):
    1. assets/ui/layout.html   —— 页面骨架：顶栏/目录/正文容器/页脚（改 UI 布局、加板块就改这里）
       page skeleton: header/nav/main/footer — edit here for UI changes
    2. assets/css/style.css    —— 全部样式 / all styles
    3. assets/js/main.js       —— 渲染引擎 / rendering engine
    4. assets/content.json     —— 教程正文 / tutorial content
-->
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FiveM Mods Installation Tutorial</title>
  <script>
    /* ======================================================================
     * 引导器 / Bootstrap
     * 拉取顺序：layout（骨架）→ css（样式）→ main.js（渲染引擎，内部再
     * 拉 content.json）。每步都走 GitHub 优先 + CDN 备用。
     * Order: layout → css → main.js (which fetches content.json).
     * Every step uses GitHub first with a CDN fallback.
     * ====================================================================== */
    var CONFIG = {
      owner:  "TEARLESSVVOID",
      repo:   "FiveM_Legacy-Graphics-Pack-Installation-Guide-Chinese-English",
      branch: "main",
      layout:  "assets/ui/layout.html",
      css:    "assets/css/style.css",
      js:     "assets/js/main.js",
      content: "assets/content.json"
    };
    CONFIG.OK = CONFIG.owner !== "YOUR_GITHUB_USERNAME" && CONFIG.repo !== "YOUR_REPO_NAME";

    /* 超时阈值（毫秒）：GitHub 直连超过此时长就切换 CDN 加速。
       Timeout (ms) for GitHub direct fetch before switching to CDN. */
    var LOAD_TIMEOUT = 3000;

    // GitHub 直连地址 / Direct GitHub URL
    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" + CONFIG.owner + "/" + CONFIG.repo + "/" + CONFIG.branch + "/" + path;
    }
    // jsdelivr CDN 备用地址 / jsdelivr CDN fallback URL
    function cdnUrl(path) {
      return "https://cdn.jsdelivr.net/gh/" + CONFIG.owner + "/" + CONFIG.repo + "@" + CONFIG.branch + "/" + path;
    }

    /* 拉取文本/JSON：先请求 GitHub；超时或失败后改用 CDN。
       Fetch text/JSON: try GitHub first; fall back to the CDN on timeout/failure. */
    function fetchAny(path, asJson) {
      var gUrl = rawUrl(path) + "?t=" + Date.now();
      var cUrl = cdnUrl(path);
      function ok(r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return asJson ? r.json() : r.text();
      }
      return new Promise(function (resolve, reject) {
        var settled = false, timedOut = false;
        function win(v) { if (!settled) { settled = true; resolve(v); } }
        function lose(e) { if (!settled) { settled = true; reject(e); } }
        fetch(gUrl).then(function (r) {
          if (!timedOut) ok(r).then(win, lose);
        }, function () {
          // GitHub 请求立即失败 → 直接用 CDN / GitHub failed at once → CDN
          if (!settled) fetch(cUrl).then(ok).then(win, lose);
        });
        setTimeout(function () {
          timedOut = true; // GitHub 太慢，忽略其迟到结果 / too slow, ignore late result
          fetch(cUrl).then(ok).then(win, lose);
        }, LOAD_TIMEOUT);
      });
    }

    window.CONFIG = CONFIG;
    window.LOAD_TIMEOUT = LOAD_TIMEOUT;
    window.RAW_URL = rawUrl;
    window.CDN_URL = cdnUrl;
    window.FETCH_ANY = fetchAny;

    /* 动态加载主脚本（GitHub 优先，onerror/超时切 CDN）。
       script 元素插入文档后修改 src 不会重新加载，切换时要新建元素。
       Load main script (GitHub first, CDN on error/timeout). Once appended,
       changing a script's src does not reload it — create a fresh element. */
    /* 动态加载主脚本：用 fetchAny 取文本后内联执行（GitHub 优先、
       CDN 兜底、超时切换已由 fetchAny 处理）。
       内联执行保证只有一个引擎在跑 —— 避免 GitHub 与 CDN 两个脚本
       同时执行、互相覆盖（旧版引擎会用旧数据结构渲染新内容而崩溃）。
       Load main script as inline text via fetchAny (GitHub first, CDN
       fallback, timeout — all inside fetchAny). Inline execution
       guarantees a single engine, avoiding two scripts racing. */
    function loadMain() {
      fetchAny(CONFIG.js, false).then(function (code) {
        var s = document.createElement("script");
        s.textContent = code;
        document.head.appendChild(s);
      });
    }

    /* 页面就绪：注入 layout → 注入 css → 加载 main.js。
       先隐藏 body 防止无样式闪烁，资源就绪后再显示。
       On ready: inject layout → inject css → load main.js.
       Body is hidden to avoid an unstyled flash until assets arrive. */
    document.addEventListener("DOMContentLoaded", function () {
      if (!CONFIG.OK) {
        document.body.innerHTML =
          '<div style="background:#2b1d1c;color:#f2c9c2;padding:20px;font-family:sans-serif">' +
          '请在 index.html 的 CONFIG 里填写你自己的 GitHub 用户名与仓库名。<br>' +
          'Fill in your GitHub username and repo name in CONFIG inside index.html.</div>';
        return;
      }
      document.body.style.visibility = "hidden";
      fetchAny(CONFIG.layout, false)
        .then(function (html) {
          document.body.innerHTML = html;
          return fetchAny(CONFIG.css, false).then(function (css) {
            var st = document.createElement("style");
            st.textContent = css;
            document.head.appendChild(st);
          }).catch(function (e) { console.error("css failed:", e); });
        })
        .then(function () {
          document.body.style.visibility = "";
          loadMain();
        })
        .catch(function (e) {
          console.error("layout failed:", e);
          document.body.style.visibility = "";
          document.body.innerHTML =
            '<div style="background:#2b1d1c;color:#f2c9c2;padding:20px;font-family:sans-serif">' +
            '无法加载页面资源，请检查网络。Could not load the page. Check your network.</div>';
        });
    });
  </script>
</head>
<body>
</body>
</html>
